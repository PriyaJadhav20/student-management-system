<!DOCTYPE html>
<html>
<head>
    <title>Edit Result - Student Management System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f5f7fb; }
        .card { border-radius: 12px; border: none; }
    </style>
</head>

<body>

<nav class="navbar navbar-dark bg-primary px-4">
    <span class="navbar-brand fw-bold">Student Management System</span>
    <div class="text-white">
        {{ session['user'] }} |
        <a href="/logout" class="text-white text-decoration-none">Logout</a>
    </div>
</nav>

<div class="container mt-4">
    <div class="card p-4 shadow col-md-6 mx-auto">
        <h4 class="mb-1">Edit Result</h4>
        <p class="text-muted small mb-3">
            {{ result.student.name }} ({{ result.student.roll_no }})
        </p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% for category, message in messages %}
            <div class="alert alert-{{category}} py-2">{{ message }}</div>
          {% endfor %}
        {% endwith %}

        <form method="POST">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <label class="form-label small mb-1">Subject</label>
            <input type="text" name="subject" class="form-control mb-3"
                   value="{{ result.subject }}" required>

            <label class="form-label small mb-1">Marks (0-100)</label>
            <input type="number" name="marks" class="form-control mb-3"
                   value="{{ result.marks }}" min="0" max="100" required>

            <button class="btn btn-primary w-100">Save Changes</button>
            <a href="/" class="btn btn-secondary mt-2 w-100">Cancel</a>
        </form>
    </div>
</div>

</body>
</html>
